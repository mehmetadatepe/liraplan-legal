<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LiraPlan: gelir, gider ve gelecek planınız tek yerde.">
  <title>LiraPlan</title>
  <style>
    :root { color-scheme:light; --ink:#0d1b2e; --muted:#52645f; --paper:#f6faf8; --card:#fff; --accent:#018669; --line:#d9e5e0; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--paper); color:var(--ink); line-height:1.7; }
    main { width:min(760px,calc(100% - 32px)); margin:0 auto; padding:56px 0; text-align:center; }
    img { width:min(260px,60vw); height:auto; }
    h1 { margin:18px 0 4px; font-size:clamp(2.2rem,7vw,3.4rem); letter-spacing:-.03em; }
    h1 span { color:var(--accent); }
    .lead { color:var(--muted); font-size:1.1rem; }
    .links { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:28px; }
    .links a { border:1px solid var(--line); border-radius:999px; padding:10px 18px; background:var(--card); color:var(--accent); font-weight:700; text-decoration:none; }
    footer { color:var(--muted); margin-top:40px; font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <img src="liraplan-ikon.png" alt="LiraPlan">
    <h1>Lira<span>Plan</span></h1>
    <p class="lead">Gelir, gider ve gelecek planınız tek yerde. Verileriniz yalnızca telefonunuzda kalır.</p>
    <div class="links">
      <a href="privacy/">Gizlilik Politikası</a>
      <a href="support/">Destek</a>
    </div>
    <footer>© 2026 Adatepe Labs · <a href="mailto:support@adatepelabs.com">support@adatepelabs.com</a></footer>
  </main>
</body>
</html>
